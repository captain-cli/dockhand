name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Captain Core
        run: python -m pip install "git+https://github.com/captain-cli/captain-core.git"

      - name: Install Dockhand
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q
